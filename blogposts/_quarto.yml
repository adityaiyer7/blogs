project:
  type: website
  output-dir: docs
  pre-render:
    - python3 scripts/update_post_visibility.py
  # Adds the "Pinned" badge and the series label to listing cards. Ordering is
  # handled natively by the listing sorts; only the labels need
  # post-processing (see the script).
  post-render:
    - python3 scripts/inject_listing_badges.py

metadata-files:
  - _links.yml
  - _post_visibility.yml
  - _hidden_posts.yml
  - _pin_defaults.yml

# Estimated reading time. Native to Quarto listings only; this filter also
# surfaces it on individual post pages (see filters/reading-time.lua).
filters:
  - filters/reading-time.lua
  # Chooses between the sectioned homepage and the chronological fallback
  # (see filters/post_visibility.lua). Registered project-wide rather than in
  # index.qmd, because a document-level `filters:` key replaces this list
  # instead of extending it, which would drop reading-time on the homepage.
  #
  # The filter only removes headings and wrappers. It cannot remove a listing:
  # Quarto injects those after every Lua filter phase, so deleting a listing's
  # placement div just makes Quarto append the orphaned listing to the end of
  # the page. Emptying disabled listings is handled by the sections-active gate
  # in _hidden_posts.yml instead.
  - filters/post_visibility.lua
  # Links a series post back to its landing page (see filters/series_banner.lua).
  # Registered *after* reading-time.lua on purpose: both insert at block 1, so
  # the later filter's block ends up on top, which is what puts the series
  # banner above the reading-time line.
  - filters/series_banner.lua

# Render the native listing reading-time string as "N min read" (default is
# "N min") so listing cards and post pages read identically.
language:
  listing-page-minutes-compact: "{0} min read"

website:
  description: "Notes on mechanistic interpretability and machine learning."
  site-url: https://adityaiyer7.github.io/blogs
  comments:
    giscus:
      repo: adityaiyer7/blogs
      repo-id: R_kgDOPEENLQ
      category: "Blog Comments"
      category-id: DIC_kwDOPEENLc4C5l2J
      mapping: pathname
      reactions-enabled: true
      input-position: bottom
      theme: preferred_color_scheme
      language: en
  body-footer: |
    <script>
      window.goatcounter = {
        path: function(p) {
          return location.pathname.replace(/index\.html$/, '');
        }
      };
      (function() {
        var s = document.createElement('script');
        s.async = true;
        s.src = '//gc.zgo.at/count.js';
        s.setAttribute('data-goatcounter', 'https://adityaiyer7.goatcounter.com/count');
        document.body.appendChild(s);
      })();
    </script>

format:
  html:
    theme: cosmo
    css: styles.css
    mainfont: "Lora"
    highlight-style: github
    code-fold: true
    code-tools: false
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    number-sections: false
    df-print: paged
    fig-align: center
    math: mathjax
    # Inline citation rendering (see citation_instruction_user.md / citation_instruction_agent.md).
    # These are inert for posts that contain no citations, so they are safe to set globally.
    csl: nature.csl           # superscript numbers + numbered reference list (CC-BY-SA)
    link-citations: true      # make the superscript a link to its reference entry (NOT a Pandoc default)
    link-bibliography: true   # make URLs in the reference list clickable (default true; explicit for clarity)
    citations-hover: true     # hover preview popup of the source (default true; explicit for clarity)
    grid:
      body-width: 850px
      margin-width: 300px
